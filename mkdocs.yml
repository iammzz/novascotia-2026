site_name: Nova Scotia 2026
site_description: Autumn road trip & Cabot Trail master plan — October 9–14, 2026
site_url: https://novascotia.teaham.ca
site_author: Matthew Zhang

theme:
  name: material
  language: en
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Welcome: index.md
  - Core Itinerary (Oct 9–14):
      - "Day 0 — Arrival: Halifax & the Maritime Museum": day0_flight_transit_arrival.md
      - "Day 1 — Marine Drive to West Bay": day1_halifax_to_west_bay.md
      - "Day 2 — Margaree Valley & Skyline Sunset": day2_western_cabot_trail_skyline.md
      - "Day 3 — Highlands, Meat Cove & Keltic Ingonish": day3_northern_eastern_cabot_trail.md
      - "Day 4 — Pictou, Grohmann & the South Shore Dome": day4_ingonish_to_lahave.md
      - "Day 5 — LaHave, Lunenburg & Peggy's Cove": day5_lahave_to_yhz.md
  - Planning & Logistics:
      - Logistics Master: logistics.md
      - Action To-Do List: todo.md
      - Travel Tips & Moose Safety: tips.md
      - Flight & Trip Research: research.md
      - Packing Checklist: packing_list.md
      - Interactive Maps & GPS: maps.md
  - Extras & Ideas:
      - Potential Activities Vault: potential_activities.md
      - Ideas for Extra Days: ideas_for_extra.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
