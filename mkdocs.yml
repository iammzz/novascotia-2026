site_name: Nova Scotia 2026
site_url: https://novascotia.teaham.ca

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Welcome: index.md
  - Core Itinerary (Oct 10–14):
      - Day 1 (Halifax to Cape Breton): day1_halifax_to_baddeck.md
      - Day 2 (Western Cabot Trail & Skyline): day2_western_cabot_trail_skyline.md
      - Day 3 (Highlands, Meat Cove & Ingonish): day3_northern_eastern_cabot_trail.md
      - Day 4 (Celtic Culture & Return Drive): day4_baddeck_to_halifax_heritage.md
      - Day 5 (Halifax City & Peggy's Cove): day5_halifax_peggys_cove.md
  - Flexible Buffer Days:
      - Day 0 (Optional Pre-Trip Arrival): day0_flight_transit_arrival.md
      - Day 6 (Optional Post-Trip Departure): day6_bay_of_fundy_departure.md
  - Planning & Logistics:
      - Logistics Master: logistics.md
      - Flight & Trip Research: research.md
      - Travel Tips & Moose Safety: tips.md
      - Action To-Do List: todo.md
      - Packing Checklist: packing_list.md
      - Interactive Maps & GPS: maps.md
  - Extras & Ideas:
      - Potential Activities Vault: potential_activities.md
      - Ideas for Extra Days: ideas_for_extra.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
